# ═══════════════════════════════════════════════════════════
#  CI Pipeline — Smart Task Manager
#  Triggers: push/PR to dev & main branches
# ═══════════════════════════════════════════════════════════

name: CI Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  # ── Job 1: Backend Tests ──────────────────────────────
  backend-tests:
    name: 🐍 Backend Tests
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'task_manager/backend/requirements.txt'

      - name: 📦 Install backend dependencies
        working-directory: task_manager/backend
        run: pip install -r requirements.txt

      - name: 🧪 Run Django unit tests
        working-directory: task_manager/backend
        env:
          MONGO_HOST: localhost
          MONGO_PORT: 27017
          MONGO_DB: testdb_ci
          JWT_SECRET: ci-test-secret-key
        run: python3 manage.py test core -v 2

  # ── Job 2: Frontend Tests ─────────────────────────────
  frontend-tests:
    name: ⚛️ Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'task_manager/frontend/package-lock.json'

      - name: 📦 Install frontend dependencies
        working-directory: task_manager/frontend
        run: npm ci

      - name: 🧪 Run React tests
        working-directory: task_manager/frontend
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: 🏗️ Build frontend
        working-directory: task_manager/frontend
        run: npm run build

  # ── Job 3: Docker Build Verification ──────────────────
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build backend image
        uses: docker/build-push-action@v5
        with:
          context: task_manager/backend
          push: false
          tags: taskmanager-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: task_manager/frontend
          push: false
          tags: taskmanager-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
