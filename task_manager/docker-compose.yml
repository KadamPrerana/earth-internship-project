version: '3.8'

services:
  # ── MongoDB ──────────────────────────────────────────
  mongo:
    image: mongo:6
    container_name: taskmanager-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - taskmanager-net

  # ── Django Backend ───────────────────────────────────
  backend:
    build: ./backend
    container_name: taskmanager-backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB=taskmanager_db
      - JWT_SECRET=taskmanager-secret-key-2026
      - DEBUG=True
    depends_on:
      - mongo
    networks:
      - taskmanager-net
    restart: unless-stopped

  # ── React Frontend ──────────────────────────────────
  frontend:
    build: ./frontend
    container_name: taskmanager-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - taskmanager-net
    restart: unless-stopped

volumes:
  mongo_data:


networks:
  taskmanager-net:
    driver: bridge
