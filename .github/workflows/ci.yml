# ═══════════════════════════════════════════════════════════
#  CI Pipeline — Earth Internship Project
#  Covers: earth-backend, earth-frontend, task_manager
#  Triggers: push/PR to dev & main branches
# ═══════════════════════════════════════════════════════════

name: CI/CD Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  # ════════════════════════════════════════════════════════
  #  EARTH PROJECT TESTS
  # ════════════════════════════════════════════════════════

  test-earth-backend:
    name: 🌍 Earth Backend Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          cd earth-backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Django Tests
        env:
          MONGO_HOST: localhost
          MONGO_PORT: 27017
          MONGO_DB: test_db
        run: |
          cd earth-backend/backend
          python manage.py test users

  test-earth-frontend:
    name: 🌍 Earth Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd earth-frontend
          npm install
      - name: Run React Tests
        run: |
          cd earth-frontend
          npm test -- --watchAll=false

  # ════════════════════════════════════════════════════════
  #  TASK MANAGER TESTS
  # ════════════════════════════════════════════════════════

  test-taskmanager-backend:
    name: 📋 Task Manager Backend Tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'task_manager/backend/requirements.txt'

      - name: 📦 Install dependencies
        working-directory: task_manager/backend
        run: pip install -r requirements.txt

      - name: 🧪 Run Django unit tests (31 tests)
        working-directory: task_manager/backend
        env:
          MONGO_HOST: localhost
          MONGO_PORT: 27017
          MONGO_DB: testdb_ci
          JWT_SECRET: ci-test-secret-key
        run: python3 manage.py test core -v 2

  test-taskmanager-frontend:
    name: ⚛️ Task Manager Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'task_manager/frontend/package-lock.json'

      - name: 📦 Install dependencies
        working-directory: task_manager/frontend
        run: npm ci

      - name: 🧪 Run React tests
        working-directory: task_manager/frontend
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: 🏗️ Build frontend (production)
        working-directory: task_manager/frontend
        run: npm run build

  # ════════════════════════════════════════════════════════
  #  DOCKER BUILD VERIFICATION
  # ════════════════════════════════════════════════════════

  docker-build:
    name: 🐳 Docker Build Verification
    runs-on: ubuntu-latest
    needs:
      - test-earth-backend
      - test-earth-frontend
      - test-taskmanager-backend
      - test-taskmanager-frontend
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Earth project Docker builds
      - name: 🌍 Build Earth Backend image
        run: docker build -t earth-backend ./earth-backend

      - name: 🌍 Build Earth Frontend image
        run: docker build -t earth-frontend ./earth-frontend

      # Task Manager Docker builds
      - name: 📋 Build Task Manager Backend image
        uses: docker/build-push-action@v5
        with:
          context: task_manager/backend
          push: false
          tags: taskmanager-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📋 Build Task Manager Frontend image
        uses: docker/build-push-action@v5
        with:
          context: task_manager/frontend
          push: false
          tags: taskmanager-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
